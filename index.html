<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cello sight reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF0EC; --surface: #FFFFFF; --ink: #1C2226; --muted: #5E6A66;
    --accent: #6E2F1A; --accent-ink: #FFFFFF; --line: #C9D0CB;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161A1C; --surface: #1F2427; --ink: #E6E9E4; --muted: #97A19C;
      --accent: #D08A5E; --accent-ink: #1A1210; --line: #333B3E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161A1C; --surface: #1F2427; --ink: #E6E9E4; --muted: #97A19C;
    --accent: #D08A5E; --accent-ink: #1A1210; --line: #333B3E;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; font-weight: 700; margin: 0; color: var(--muted); }
  .header-controls { display: flex; gap: 10px; align-items: center; }

  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .segmented button {
    border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted);
  }
  .segmented button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .ghost {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 16px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--muted); }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 16px 24px; gap: 4px;
  }
  .name {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(4.5rem, 16vw, 8rem); line-height: 1; height: 1.1em;
    color: var(--accent); opacity: 0; transition: opacity 180ms ease-out;
    user-select: none;
  }
  .name.shown { opacity: 1; }
  .name .oct { font-size: 0.42em; vertical-align: baseline; margin-left: 0.04em; color: var(--muted); }

  .stage { width: 100%; max-width: 760px; cursor: pointer; }
  #staff { display: block; width: 100%; height: auto; }
  .ink { fill: var(--ink); }
  .stroke { stroke: var(--ink); }
  .hole { fill: var(--bg); }

  .progress { width: 100%; max-width: 620px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress div { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }

  .controls { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 12px 34px; font-weight: 700; cursor: pointer; min-width: 9em;
  }
  .primary:hover { filter: brightness(1.08); }
  .controls .ghost { padding: 12px 24px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 16px; text-align: center; max-width: 36em; }
  kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }

  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink);
    width: min(440px, calc(100vw - 32px)); max-height: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(10, 14, 16, 0.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 4px; }
  .dlg-head h2 { margin: 0; font-size: 1.2rem; }
  .close { border: 0; background: transparent; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .dlg-body { padding: 8px 20px 4px; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 14px 0 10px; }
  fieldset:first-of-type { border-top: 0; }
  legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
  .row label { flex: 1; }
  .row input[type="number"], .row select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 8.5em;
  }
  .row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  .help { color: var(--muted); font-size: 0.82rem; margin: -2px 0 6px; }
  .error { color: #B3261E; font-size: 0.85rem; min-height: 1.3em; margin: 4px 0 0; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 20px 18px; }
  .dlg-foot .primary { padding: 9px 22px; min-width: 0; }
  .dlg-foot .ghost { padding: 9px 20px; }

  @media (prefers-reduced-motion: reduce) { .name { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Cello sight reading</h1>
  <div class="header-controls">
    <div class="segmented" role="group" aria-label="Clef">
      <button type="button" data-clef="bass" aria-pressed="true">Bass</button>
      <button type="button" data-clef="treble" aria-pressed="false">Treble</button>
    </div>
    <button type="button" class="ghost" id="openSettings">Settings</button>
  </div>
</header>

<main>
  <div class="name" id="name" aria-live="polite"></div>
  <div class="stage" id="stage" title="Tap to show the name">
    <svg id="staff" viewBox="0 0 600 330" role="img" aria-label="Note on the staff"></svg>
  </div>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <div class="controls">
    <button type="button" class="primary" id="playBtn">Start</button>
    <button type="button" class="ghost" id="nextBtn">Next note</button>
  </div>
  <p class="hint"><kbd>Space</kbd> starts or pauses, <kbd>→</kbd> skips to the next note. Tap the staff to show the name early.</p>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <div class="dlg-head">
      <h2>Settings</h2>
      <button type="button" class="close" id="closeX" aria-label="Close">×</button>
    </div>
    <div class="dlg-body">
      <fieldset>
        <legend>Timing</legend>
        <div class="row">
          <label for="sInterval">Seconds per note</label>
          <input type="number" id="sInterval" min="0.5" max="60" step="0.1" inputmode="decimal">
        </div>
        <div class="row">
          <label for="sShowName">Show note name</label>
          <input type="checkbox" id="sShowName">
        </div>
        <div class="row">
          <label for="sReveal">Show name after (seconds)</label>
          <input type="number" id="sReveal" min="0" max="60" step="0.1" inputmode="decimal">
        </div>
        <p class="help">Must be shorter than the time per note.</p>
      </fieldset>
      <fieldset>
        <legend>Bass clef range</legend>
        <div class="row"><label for="sBassLo">Lowest note</label><select id="sBassLo"></select></div>
        <div class="row"><label for="sBassHi">Highest note</label><select id="sBassHi"></select></div>
      </fieldset>
      <fieldset>
        <legend>Treble clef range</legend>
        <div class="row"><label for="sTrebleLo">Lowest note</label><select id="sTrebleLo"></select></div>
        <div class="row"><label for="sTrebleHi">Highest note</label><select id="sTrebleHi"></select></div>
      </fieldset>
      <fieldset>
        <legend>Notes</legend>
        <div class="row">
          <label for="sAcc">Include sharps and flats</label>
          <input type="checkbox" id="sAcc">
        </div>
        <div class="row">
          <label for="sOct">Show octave number (e.g. D2)</label>
          <input type="checkbox" id="sOct">
        </div>
        <div class="row">
          <label for="sLang">Note names</label>
          <select id="sLang">
            <option value="en">English (B)</option>
            <option value="de">German (H)</option>
          </select>
        </div>
      </fieldset>
      <p class="error" id="err"></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";
  const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
  // Notes are stored as a diatonic index: octave * 7 + letter index (C2 = 14, C4 = 28)
  const OPTION_RANGE = { bass: [14, 37], treble: [21, 47] }; // bass C2–E5, treble C3–A6
  const STORE_KEY = "cello-sight-reading-v2";

  const DEFAULTS = {
    interval: 3, reveal: 2, showName: true, clef: "bass",
    ranges: { bass: [14, 28], treble: [29, 40] }, // bass C2–C4, treble D4–A5
    accidentals: false, octave: false, lang: "en"
  };

  let settings = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.clef !== "bass" && s.clef !== "treble") s.clef = "bass";
        return Object.assign({}, DEFAULTS, s, { ranges: Object.assign({}, DEFAULTS.ranges, s.ranges || {}) });
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  // ---------- naming ----------
  function noteName(d, acc) {
    const letter = LETTERS[d % 7];
    const sym = acc === 1 ? "♯" : acc === -1 ? "♭" : "";
    if (settings.lang === "de" && letter === "B") return acc === -1 ? "B" : "H" + sym;
    return letter + sym;
  }
  function plainName(d) { return LETTERS[d % 7] + Math.floor(d / 7); }

  // ---------- staff drawing ----------
  const STAFF_TOP = 130, SP = 20, HALF = 10, BOTTOM = STAFF_TOP + 4 * SP;
  const NOTE_X = 340;
  const BOTTOM_LINE = { bass: 18, treble: 30 }; // G2 / E4

  const BASS_CLEF =
    '<g transform="translate(56,150)" class="ink">' +
      '<circle cx="12" cy="0" r="8.5"/>' +
      '<path d="M 5 -1 C 3 -27 49 -33 51 -3 C 53 28 27 50 -2 65 C 22 49 38 26 36 -3 C 34 -23 15 -23 11 -9 Z"/>' +
      '<circle cx="63" cy="-10" r="3.8"/><circle cx="63" cy="10" r="3.8"/>' +
    '</g>';

  const TREBLE_CLEF =
    '<g transform="translate(50,190)">' +
      '<path d="M 22 4 C 12 4 10 -10 20 -14 C 34 -18 44 -4 38 8 C 32 20 8 20 2 6 C -4 -8 8 -24 22 -38 C 34 -50 38 -64 34 -76 C 30 -86 20 -80 18 -66 C 16 -52 22 -10 28 36 C 30 50 20 56 12 50" ' +
      'fill="none" class="stroke" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="13" cy="46" r="5.5" class="ink"/>' +
    '</g>';

  function yFor(d, clef) { return BOTTOM - (d - BOTTOM_LINE[clef]) * HALF; }

  function drawStaff(note) {
    const clef = settings.clef;
    let s = "";
    for (let i = 0; i < 5; i++) {
      const y = STAFF_TOP + i * SP;
      s += '<line x1="30" x2="570" y1="' + y + '" y2="' + y + '" class="stroke" stroke-width="2"/>';
    }
    s += clef === "bass" ? BASS_CLEF : TREBLE_CLEF;
    if (note) {
      const b = BOTTOM_LINE[clef], top = b + 8;
      const y = yFor(note.d, clef);
      const ledger = (k) => {
        const ly = yFor(k, clef);
        s += '<line x1="' + (NOTE_X - 27) + '" x2="' + (NOTE_X + 27) + '" y1="' + ly + '" y2="' + ly + '" class="stroke" stroke-width="2.4"/>';
      };
      for (let k = b - 2; k >= note.d; k -= 2) ledger(k);
      for (let k = top + 2; k <= note.d; k += 2) ledger(k);
      if (note.acc !== 0) {
        const glyph = note.acc === 1 ? "♯" : "♭";
        const dy = note.acc === 1 ? 13 : 7;
        s += '<text x="' + (NOTE_X - 34) + '" y="' + (y + dy) + '" text-anchor="middle" font-size="42" class="ink" ' +
             'font-family="\'Segoe UI Symbol\', \'Apple Symbols\', \'DejaVu Sans\', serif">' + glyph + '</text>';
      }
      s += '<g transform="translate(' + NOTE_X + ',' + y + ')">' +
             '<path fill-rule="evenodd" class="ink" d="M -15.5 0 A 15.5 10.5 0 1 0 15.5 0 A 15.5 10.5 0 1 0 -15.5 0 Z ' +
             'M -5.17 6.62 A 5.2 8.4 38 1 0 5.17 -6.62 A 5.2 8.4 38 1 0 -5.17 6.62 Z"/>' +
           '</g>';
    }
    document.getElementById("staff").innerHTML = s;
  }

  // ---------- note picking ----------
  let current = null;
  function pool() {
    const [lo, hi] = settings.ranges[settings.clef];
    const out = [];
    for (let d = lo; d <= hi; d++) {
      const letter = LETTERS[d % 7];
      out.push({ d, acc: 0 });
      if (settings.accidentals) {
        if (letter !== "E" && letter !== "B") out.push({ d, acc: 1 });
        if (letter !== "C" && letter !== "F") out.push({ d, acc: -1 });
      }
    }
    return out;
  }
  function pickNote() {
    let p = pool();
    if (p.length > 1 && current) p = p.filter(n => !(n.d === current.d && n.acc === current.acc));
    return p[Math.floor(Math.random() * p.length)];
  }

  // ---------- timing ----------
  const nameEl = document.getElementById("name");
  const bar = document.getElementById("bar");
  const playBtn = document.getElementById("playBtn");
  let running = false, elapsed = 0, lastT = null, revealed = false;

  function showName() {
    if (!current) return;
    let html = noteName(current.d, current.acc);
    if (settings.octave) html += '<span class="oct">' + Math.floor(current.d / 7) + '</span>';
    nameEl.innerHTML = html;
    nameEl.classList.add("shown");
    revealed = true;
  }
  function hideName() { nameEl.classList.remove("shown"); revealed = false; }

  function nextNote() {
    current = pickNote();
    elapsed = 0;
    hideName();
    drawStaff(current);
    bar.style.transform = "scaleX(0)";
  }

  function tick(t) {
    if (lastT === null) lastT = t;
    const dt = t - lastT;
    lastT = t;
    if (running) {
      elapsed += dt;
      const total = settings.interval * 1000;
      if (settings.showName && !revealed && elapsed >= settings.reveal * 1000) showName();
      if (elapsed >= total) nextNote();
      bar.style.transform = "scaleX(" + Math.min(1, elapsed / total) + ")";
    }
    requestAnimationFrame(tick);
  }

  function setRunning(on) {
    running = on;
    playBtn.textContent = on ? "Pause" : (elapsed > 0 ? "Resume" : "Start");
  }

  playBtn.addEventListener("click", () => setRunning(!running));
  document.getElementById("nextBtn").addEventListener("click", () => { nextNote(); if (!running) setRunning(false); });
  document.getElementById("stage").addEventListener("click", () => { if (revealed) hideName(); else showName(); });

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("settings").open) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (e.code === "Space" && tag !== "button") { e.preventDefault(); setRunning(!running); }
    else if (e.code === "Space" && tag === "button") { /* let the focused button handle it */ }
    else if (e.key === "ArrowRight") { e.preventDefault(); nextNote(); if (!running) setRunning(false); }
  });

  // ---------- clef toggle ----------
  const clefBtns = document.querySelectorAll("[data-clef]");
  function syncClefButtons() {
    clefBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.clef === settings.clef)));
  }
  clefBtns.forEach(b => b.addEventListener("click", () => {
    if (settings.clef === b.dataset.clef) return;
    settings.clef = b.dataset.clef;
    save(); syncClefButtons(); nextNote();
  }));

  // ---------- settings dialog ----------
  const dlg = document.getElementById("settings");
  const $ = (id) => document.getElementById(id);
  const rangeSelects = ["sBassLo", "sBassHi", "sTrebleLo", "sTrebleHi"];
  rangeSelects.forEach(id => {
    const sel = $(id);
    const [minD, maxD] = OPTION_RANGE[id.startsWith("sBass") ? "bass" : "treble"];
    for (let d = minD; d <= maxD; d++) {
      const o = document.createElement("option");
      o.value = d;
      o.textContent = plainName(d) + (d === 28 ? " (middle C)" : "");
      sel.appendChild(o);
    }
  });

  let wasRunning = false;
  function openSettings() {
    wasRunning = running;
    setRunning(false);
    $("sInterval").value = settings.interval;
    $("sReveal").value = settings.reveal;
    $("sShowName").checked = settings.showName;
    $("sBassLo").value = settings.ranges.bass[0];
    $("sBassHi").value = settings.ranges.bass[1];
    $("sTrebleLo").value = settings.ranges.treble[0];
    $("sTrebleHi").value = settings.ranges.treble[1];
    $("sAcc").checked = settings.accidentals;
    $("sOct").checked = settings.octave;
    $("sLang").value = settings.lang;
    $("err").textContent = "";
    syncRevealDisabled();
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  function closeSettings() {
    if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
    if (wasRunning) setRunning(true);
  }
  function syncRevealDisabled() { $("sReveal").disabled = !$("sShowName").checked; }
  $("sShowName").addEventListener("change", syncRevealDisabled);

  $("openSettings").addEventListener("click", openSettings);
  $("cancelBtn").addEventListener("click", closeSettings);
  $("closeX").addEventListener("click", closeSettings);
  dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeSettings(); });

  $("settingsForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const interval = parseFloat(String($("sInterval").value).replace(",", "."));
    const reveal = parseFloat(String($("sReveal").value).replace(",", "."));
    const showNm = $("sShowName").checked;
    const err = $("err");
    if (!isFinite(interval) || interval < 0.5) { err.textContent = "Seconds per note must be at least 0.5."; return; }
    if (showNm && (!isFinite(reveal) || reveal < 0)) { err.textContent = "Enter how many seconds to wait before showing the name."; return; }
    if (showNm && reveal >= interval) { err.textContent = "Show the name before the next note: use a number below " + interval + "."; return; }
    const bl = +$("sBassLo").value, bh = +$("sBassHi").value;
    const tl = +$("sTrebleLo").value, th = +$("sTrebleHi").value;
    if (bl > bh) { err.textContent = "Bass clef: the lowest note is above the highest note."; return; }
    if (tl > th) { err.textContent = "Treble clef: the lowest note is above the highest note."; return; }

    const clefRangeChanged = settings.ranges[settings.clef].join() !== (settings.clef === "bass" ? [bl, bh] : [tl, th]).join();
    const accChanged = settings.accidentals !== $("sAcc").checked;

    settings.interval = Math.round(interval * 100) / 100;
    settings.reveal = isFinite(reveal) ? Math.round(reveal * 100) / 100 : settings.reveal;
    settings.showName = showNm;
    settings.ranges = { bass: [bl, bh], treble: [tl, th] };
    settings.accidentals = $("sAcc").checked;
    settings.octave = $("sOct").checked;
    settings.lang = $("sLang").value;
    save();

    if (clefRangeChanged || accChanged) nextNote();
    else if (revealed) showName(); // refresh name format
    if (!settings.showName) hideName();
    closeSettings();
  });

  // ---------- start ----------
  syncClefButtons();
  nextNote();
  setRunning(false);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
